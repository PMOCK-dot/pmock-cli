name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The secrets context is not available in a job-level `if`, so the presence of
  # a registry credential is resolved in its own short job and the publisher
  # consumes the output. Without a token the release still ships and npm is
  # skipped with a warning, instead of burning the publish script's 20 minute
  # retry loop before failing the whole run.
  npm-preflight:
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.check.outputs.token }}
    steps:
      - name: check for NPM_TOKEN
        id: check
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "token=true" >> "$GITHUB_OUTPUT"
          else
            echo "token=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=npm publish skipped::NPM_TOKEN is not set for this repository, so $GITHUB_REF_NAME was released on GitHub but not published to npm. Add the secret and re-run the publish job, or dispatch npm.yml with this version."
          fi

  # Publishing lives here instead of npm.yml's `release: published` trigger:
  # GoReleaser creates the GitHub release with GITHUB_TOKEN, and GitHub does not
  # start workflows for events raised by that token, so the release trigger
  # never fired and npm had to be dispatched by hand.
  #
  # Depends on goreleaser so a failed release never reaches the registry. The
  # publish script is idempotent: re-running it after a partial failure (for
  # example a platform package rejected by npm spam detection) publishes only
  # what is still missing.
  publish-npm:
    needs: [goreleaser, npm-preflight]
    if: needs.npm-preflight.outputs.token == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ github.ref_name }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: build packages
        run: VERSION="${VERSION#v}" make npm
      - name: publish packages
        run: VERSION="${VERSION#v}" ./scripts/publish-npm.sh
