# Product-layer decisions for the generated PMOCK CLI catalog.
#
# Every operation in openapi/pmock-openapi.yaml must appear exactly once.
# `op` is the stable "METHOD /path" key; `path` is the user-facing command.
# `risk` drives warnings (costly) and confirmation (destructive). Operations
# marked internal are still callable but hidden from help; they are building
# blocks for higher-level commands added by hand.
commands:
  - op: GET /open/api/product/list
    path: [product, list]
    aliases: [ls]
    risk: read
    examples:
      - pmock-cli product list

  - op: POST /open/api/phone/create
    path: [phone, create]
    risk: costly
    examples:
      - pmock-cli phone create --spu-id 123 --sku-id 456 --num 1
      - pmock-cli phone create --spu-id 123 --sku-id 456 --json '{"tagIds":[1,2]}'

  - op: GET /open/api/phone/list
    path: [phone, list]
    aliases: [ls]
    risk: read
    notes: "拉全量列表先用 `--page-size 100` 取一次，只有 `rows` 少于 `total` 时才按 `--page-num` 继续翻页；不要因为上游写了「最大1条」就按 1 条一页逐页扫。"
    param_descriptions:
      page-size: "分页大小，每页显示记录数；上游写的「默认1条、最大1条」有误，实测不传即返回全部，建议传 100 一次取回全部"
    examples:
      - pmock-cli phone list --page-size 100
      - pmock-cli phone list --name-or-code demo
      - pmock-cli phone list --status 1 --page-size 100

  - op: POST /open/api/phone/authorize
    path: [phone, authorize]
    risk: write

  - op: POST /open/api/phone/unauthorize
    path: [phone, unauthorize]
    risk: write

  - op: GET /open/api/team/member/list
    path: [team, members]
    risk: read

  - op: GET /open/api/phone/resolution/list
    path: [phone, resolutions]
    risk: read

  - op: GET /open/api/phone/task/status
    path: [phone, task-status]
    risk: read
    examples:
      - pmock-cli phone task-status --phone-id 123 --operate-type powerOn

  - op: POST /open/api/network/detect
    path: [network, detect]
    risk: read

  - op: POST /open/api/phone/setNetwork
    path: [phone, network-set]
    risk: write

  - op: POST /open/api/phone/remove
    path: [phone, remove]
    aliases: [delete, rm]
    risk: destructive

  - op: POST /open/api/phone/start
    path: [phone, start]
    risk: write
    async: phone
    operate_type: powerOn
    examples:
      - pmock-cli phone start --id 123

  - op: POST /open/api/phone/stop
    path: [phone, stop]
    risk: write
    async: phone
    operate_type: powerOff
    examples:
      - pmock-cli phone stop --id 123

  - op: POST /open/api/phone/restart
    path: [phone, restart]
    risk: write
    async: phone
    operate_type: restart

  - op: POST /open/api/phone/reset
    path: [phone, reset]
    risk: destructive
    async: phone
    operate_type: reset

  - op: POST /open/api/phone/oneNew
    path: [phone, new]
    aliases: [one-new]
    risk: destructive
    async: phone
    operate_type: renew

  - op: POST /open/api/phone/clear
    path: [phone, clear]
    risk: write

  - op: POST /open/api/phone/batchRenew
    path: [phone, renew]
    risk: costly

  - op: POST /open/api/phone/getAdbInfo
    path: [phone, adb]
    risk: read

  - op: POST /open/api/phone/file/scan
    path: [phone, file, scan]
    risk: read

  - op: POST /open/api/phone/file/download
    path: [phone, file, download]
    risk: read

  - op: POST /open/api/phone/minio/init/task
    path: [phone, file, upload-init]
    risk: write
    internal: true

  - op: POST /open/api/phone/completeAndPush
    path: [phone, file, upload-push]
    risk: write
    internal: true

  - op: POST /open/api/phone/getRemoteToken
    path: [phone, remote-token]
    risk: read

  - op: POST /open/api/app/list
    path: [app, list]
    aliases: [ls]
    risk: read

  - op: GET /open/api/app/categoryList
    path: [app, categories]
    risk: read

  - op: POST /open/api/app/install
    path: [app, install]
    risk: write

  - op: POST /open/api/app/listUpgradeApp
    path: [app, upgrades]
    risk: read

  - op: POST /open/api/app/operate
    path: [app, operate]
    risk: write

  - op: POST /open/api/task/info/list
    path: [task, list]
    aliases: [ls]
    risk: read

  - op: POST /open/api/brand/list
    path: [brand, list]
    aliases: [ls]
    risk: read

  - op: GET /open/api/network/list
    path: [network, list]
    aliases: [ls]
    risk: read

  - op: POST /open/api/getPhoneModelList
    path: [phone, models]
    risk: read

  - op: GET /open/api/rpa/template/getMarkList
    path: [rpa, template, market]
    risk: read

  - op: GET /open/api/rpa/template/getList
    path: [rpa, template, list]
    aliases: [ls]
    risk: read

  - op: POST /open/api/rpa/template/collect
    path: [rpa, template, collect]
    risk: write

  - op: POST /open/api/rpa/template/delete
    path: [rpa, template, delete]
    risk: destructive

  - op: GET /open/api/rpa/task/getList
    path: [rpa, task, list]
    aliases: [ls]
    risk: read

  - op: GET /open/api/rpa/task/getInfo/{id}
    path: [rpa, task, get]
    risk: read
    examples:
      - pmock-cli rpa task get --id 123

  - op: GET /open/api/rpa/task/getDetailList
    path: [rpa, task, details]
    risk: read

  - op: POST /open/api/rpa/task/retryTask
    path: [rpa, task, retry]
    risk: write

  - op: POST /open/api/rpa/task/retryDetailTask
    path: [rpa, task, retry-detail]
    risk: write

  - op: POST /open/api/rpa/task/update
    path: [rpa, task, update]
    risk: write

  - op: POST /open/api/rpa/task/updateDetail
    path: [rpa, task, update-detail]
    risk: write

  - op: POST /open/api/rpa/task/stop
    path: [rpa, task, stop]
    risk: write

  - op: POST /open/api/rpa/task/stopDetail
    path: [rpa, task, stop-detail]
    risk: write

  - op: POST /open/api/rpa/task/delete
    path: [rpa, task, delete]
    risk: destructive

  - op: POST /open/api/rpa/task/deleteDetail
    path: [rpa, task, delete-detail]
    risk: destructive

  - op: POST /open/api/phone/action/click
    path: [phone, action, click]
    aliases: [tap]
    risk: write
    async: action
    examples:
      - pmock-cli phone action click --code ABC123 --pos-type 2 --pos 100,200
      - pmock-cli phone action click --code ABC123 --pos-type 1 --query "text=登录,index=0"

  - op: POST /open/api/phone/action/doubleClick
    path: [phone, action, double-click]
    risk: write
    async: action

  - op: POST /open/api/phone/action/swipe
    path: [phone, action, swipe]
    risk: write
    async: action

  - op: POST /open/api/phone/action/drag
    path: [phone, action, drag]
    risk: write
    async: action

  - op: POST /open/api/phone/action/input
    path: [phone, action, input]
    risk: write
    async: action

  - op: POST /open/api/phone/action/longClick
    path: [phone, action, long-click]
    risk: write
    async: action

  - op: POST /open/api/phone/action/app
    path: [phone, action, app]
    risk: write
    async: action

  - op: POST /open/api/phone/action/task/status
    path: [phone, action, status]
    risk: read

  - op: POST /open/api/phone/screenCap
    path: [phone, screen]
    aliases: [screenshot]
    risk: read
    defaults:
      isRemove: true
    examples:
      - pmock-cli phone screen --id 123

  - op: POST /open/api/getCpyConnect
    path: [phone, cpy-connect]
    risk: read

  - op: POST /open/api/getRemoteComponentToken
    path: [phone, stream-token]
    risk: read

  - op: POST /open/api/rpa/task/add
    path: [rpa, task, add]
    risk: write
    async: rpa
    examples:
      - pmock-cli rpa task add --template-id 456 --name daily --json '{"taskList":[{"phoneId":123}]}'

  # --- 2026-11 开放能力接口更新 -------------------------------------------
  # 手机信息的细粒度更新，替代 update 里的大而全参数

  - op: POST /open/api/phone/updateName
    path: [phone, update-name]
    risk: write
    examples:
      - pmock-cli phone update-name --id 123 --name demo-01

  - op: POST /open/api/phone/updateRemark
    path: [phone, update-remark]
    risk: write

  - op: POST /open/api/phone/batchUpdateRemark
    path: [phone, batch-update-remark]
    risk: write

  - op: POST /open/api/phone/updateTags
    path: [phone, update-tags]
    risk: write

  - op: POST /open/api/phone/batchUpdateTags
    path: [phone, batch-update-tags]
    risk: write

  # 换套餐会改变计费，和续费一样按 costly 处理
  - op: POST /open/api/phone/updateSku
    path: [phone, update-sku]
    risk: costly

  - op: POST /open/api/phone/updateEnvSetting
    path: [phone, update-env-setting]
    risk: write

  # 手机分组
  - op: GET /open/api/phone/group/list
    path: [phone, group, list]
    risk: read

  - op: POST /open/api/phone/group/create
    path: [phone, group, create]
    risk: write
    examples:
      - pmock-cli phone group create --json '{"name":"投放A"}'

  - op: POST /open/api/phone/group/update
    path: [phone, group, update]
    risk: write

  - op: POST /open/api/phone/group/delete
    path: [phone, group, delete]
    risk: destructive

  - op: POST /open/api/phone/moveGroup
    path: [phone, move-group]
    risk: write

  # 转让改成三步：发码 -> 确认 -> 取消；确认后归属变更，不可逆
  - op: POST /open/api/phone/transfer/sendCode
    path: [phone, transfer, send-code]
    risk: write

  - op: POST /open/api/phone/transfer/confirm
    path: [phone, transfer, confirm]
    risk: destructive
    examples:
      - pmock-cli phone transfer confirm --id 123 --code 123456 --yes

  - op: POST /open/api/phone/transfer/cancel
    path: [phone, transfer, cancel]
    risk: write

  # 文件任务的进度查询，与 upload 命令配合使用
  - op: POST /open/api/phone/file/task/status
    path: [phone, file, task-status]
    risk: read

  # V2 上传协议：暂时保持内部，等 phone file upload 迁移过来再暴露
  - op: POST /open/api/phone/v2/init/uploadTask
    path: [phone, file, upload-init-v2]
    risk: write
    internal: true

  - op: POST /open/api/phone/v2/mergeFileAndPush
    path: [phone, file, upload-push-v2]
    risk: write
    internal: true

  # 标签
  - op: GET /open/api/tag/list
    path: [tag, list]
    risk: read
    aliases: [ls]

  - op: POST /open/api/tag/create
    path: [tag, create]
    risk: write
    examples:
      - pmock-cli tag create --json '{"name":"tiktok","color":"#ff0000"}'

  - op: POST /open/api/tag/update
    path: [tag, update]
    risk: write

  - op: POST /open/api/tag/delete
    path: [tag, delete]
    risk: destructive
    aliases: [rm]

  # 团队应用库
  - op: POST /open/api/app/teamApp/list
    path: [app, team-app, list]
    risk: read
    aliases: [ls]

  - op: POST /open/api/app/teamApp/create
    path: [app, team-app, add]
    risk: write

  - op: POST /open/api/app/teamApp/delete
    path: [app, team-app, remove]
    risk: destructive

  - op: POST /open/api/app/teamApp/deleteVersion
    path: [app, team-app, remove-version]
    risk: destructive

  # 代理
  - op: POST /open/api/network/add
    path: [network, add]
    risk: write
    examples:
      - pmock-cli network add --json '[{"scheme":"socks5","server":"1.2.3.4","port":1080}]'

  - op: POST /open/api/network/update
    path: [network, update]
    risk: write

  - op: POST /open/api/network/remove
    path: [network, remove]
    risk: destructive

  - op: POST /open/api/network/detail
    path: [network, detail]
    risk: read

  - op: POST /open/api/network/check
    path: [network, check]
    risk: read

  - op: GET /open/api/network/group/list
    path: [network, group, list]
    risk: read

  - op: POST /open/api/network/group/create
    path: [network, group, create]
    risk: write

  - op: POST /open/api/network/group/update
    path: [network, group, update]
    risk: write

  - op: POST /open/api/network/group/delete
    path: [network, group, delete]
    risk: destructive

  # 商品与套餐
  - op: POST /open/api/product/getChangeableSkuList
    path: [product, changeable-sku-list]
    risk: read

  # 钱包、充值、账单
  - op: GET /open/api/user/userMoney
    path: [user, balance]
    risk: read

  - op: GET /open/api/payment/getRechargeConfig
    path: [payment, recharge-config]
    risk: read

  - op: POST /open/api/payment/getRechargeOrder
    path: [payment, recharge-order]
    risk: read

  # 真实扣款，执行前必须确认金额
  - op: POST /open/api/payment/money/recharge
    path: [payment, recharge]
    risk: costly

  - op: GET /open/api/order/consumeRecord
    path: [order, consume-record]
    risk: read

  - op: GET /open/api/order/rechargeRecord
    path: [order, recharge-record]
    risk: read
