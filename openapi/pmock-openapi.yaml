components:
  schemas:
    PhoneCreateReqVOCreate:
      type: object
      properties:
        spuId:
          type: integer
          description: 商品 SPU ID
          format: int64
        skuId:
          type: integer
          description: 商品 SKU ID
          format: int64
        num:
          type: integer
          description: 购买数量
          minimum: 1
        realResolution:
          type: boolean
          description: 是否真机分辨率
        brand:
          type: string
          description: 品牌名称
        width:
          type: integer
          description: 分辨率宽度
        height:
          type: integer
          description: 分辨率高度
        phoneNumber:
          type: string
          description: 手机号
        configId:
          type: integer
          description: >-
            手机机型 ID，根据“获取机型列表”接口返回的 ID 创建对应机型的手机
          format: int64
        autoInstallFlag:
          type: integer
          description: '自动安装标志：0=关闭，1=开启'
          default: 0
        groupId:
          type: integer
          description: 分组ID，不传则为未分组
          format: int64
        remark:
          type: string
          description: 备注，最多200字符
        tagIds:
          type: array
          items:
            type: integer
          description: 标签ID列表，最多5个
      required:
        - spuId
        - skuId
        - num
    PhoneInfoResVO:
      type: object
      properties:
        id:
          type: integer
          description: 手机ID
          format: int64
        name:
          type: string
          description: 手机名称
        code:
          type: string
          description: 手机编码，业务侧自定义
    RListPhoneInfoResVO:
      type: object
      properties:
        traceId:
          type: string
          description: 请求链路 ID
        code:
          type: integer
          description: 状态码
        msg:
          type: string
          description: 请求返回消息
        data:
          type: array
          items:
            $ref: '#/components/schemas/PhoneInfoResVO'
            description: 手机信息响应对象
          description: 请求返回数据
        status:
          type: string
          description: >-
            状态，表示任务是立即完成还是处于等待状态：finish=已完成，pending=等待中
          default: finish
      required:
        - traceId
        - code
        - msg
        - status
    TableDataInfoPhonePageListResVO:
      type: object
      properties:
        traceId:
          type: string
          description: 链路id
        total:
          type: integer
          description: 总记录数
          format: int64
        rows:
          type: array
          items:
            $ref: '#/components/schemas/PhonePageListResVO'
            description: 手机列表响应对象
          description: 列表数据
        code:
          type: integer
          description: 消息状态码
        msg:
          type: string
          description: 消息内容
