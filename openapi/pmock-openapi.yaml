openapi: 3.0.1
# info:
#   title: 默认模块
#   description: ''
#   version: 1.0.0
# tags: []
paths:
  /open/api/product/list:
    get:
      summary: 获取商品列表
      deprecated: false
      description: 获取商品信息列表
      tags: [商品]
      parameters:
        - name: chameleon
          in: header
          description: ''
          example: '{{chameleon}}'
          schema:
            type: string
            default: '{{chameleon}}'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RListProductInfoVO'
              example:
                traceId: ''
                code: 0
                msg: ''
                data:
                  - spuId: 0
                    spuName: ''
                    skuList:
                      - skuId: 0
                        skuName: ''
                        chargeType: 0
                        cycle: 0
                        cycleName: ''
                        isAutoRenewal: false
                        cyclePrice: 0
                        skuExtraPriceList:
                          - id: 0
                            name: ''
                            price: 0
                            cycleName: ''
                status: ''
      security: []
  /open/api/phone/create:
    post:
      summary: 创建手机
      deprecated: false
      description: 创建手机
      tags: [手机操作]
      parameters:
        - name: chameleon
          in: header
          description: ''
          example: '{{chameleon}}'
          schema:
            type: string
            default: '{{chameleon}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneCreateReqVOCreate'
              description: ''
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RListPhoneInfoResVO'
              example:
                traceId: ''
                code: 0
                msg: ''
                data: null
                status: ''
      security: []
  /open/api/phone/list:
    get:
      summary: 获取手机列表
      deprecated: false
      description: 分页获取手机列表
      tags: [手机操作]
      parameters:
        - name: nameOrCode
          in: query
          description: 手机名称/手机编号
          required: false
          schema:
            type: string
            maxLength: 32
        - name: spuId
          in: query
          description: 商品 SPU ID
          required: false
          schema:
            type: integer
            format: int64
        - name: skuId
          in: query
          description: 版本ID
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          description: 手机状态
          required: false
          schema:
            type: integer
        - name: authorizeUserIds
          in: query
          description: >-
            授权用户 ID 列表，取当前接口返回结果中的 `userId` 值
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: expireStatus
          in: query
          description: 计费(过期)状态：0=已经过期，1=正常
          required: false
          schema:
            type: integer
        - name: skuName
          in: query
          description: 版本
          required: false
          schema:
            type: string
        - name: networkId
          in: query
          description: 网络ID
          required: false
          schema:
            type: integer
            format: int64
        - name: groupId
          in: query
          description: 手机分组ID
          required: false
          schema:
            type: integer
            format: int64
        - name: groupCode
          in: query
          description: 手机系统分组编号
          required: false
          schema:
            type: string
        - name: groupType
          in: query
          description: 手机分组类型
          required: false
          schema:
            type: string
        - name: realResolution
          in: query
          description: >-
            是否为真机分辨率：0=否，1=是
          required: false
          schema:
            type: integer
        - name: tagIds
          in: query
          description: 标签ID列表，筛选包含这些标签的设备（取并集）
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: pageSize
          in: query
          description: |-
            分页大小
            每页显示记录数
            默认为1条,单次查询最大条数为:1
          required: false
          schema:
            type: integer
        - name: pageNum
          in: query
          description: 当前页数
          required: false
          schema:
            type: integer
        - name: chameleon
          in: header
          description: ''
          example: '{{chameleon}}'
          schema:
            type: string
            default: '{{chameleon}}'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDataInfoPhonePageListResVO'
              example:
                traceId: ''
                total: 0
                rows:
                  - id: 0
                    name: ''
                    groupId: 0
                    groupName: ''
                    code: ''
                    spuId: 0
                    spuName: ''
                    skuId: 0
                    phoneModel: ''
                    phoneBrand: ''
                    adbIp: ''
                    adbPort: ''
                    adbPassword: ''
                    payType: 0
                    skuName: ''
                    cycleName: ''
                    cycleEnum: ''
                    expireStatus: 0
                    networkId: 0
                    channel: ''
                    powerOnTime: ''
                    powerOffTime: ''
                    expireTime: ''
                    expireDuration: ''
                    nextPayTime: ''
                    status: 0
                    remark: ''
                    userId: 0
                    createUser: ''
                    createTime: ''
                    updateTime: ''
                    networkResVO:
                      host: ''
                      port: 0
                      account: ''
                      password: ''
                      region: ''
                      num: 0
                      countryCode: ''
                      countryName: ''
                      type: ''
                      timezone: ''
                      language: ''
                      ip: ''
                      latitude: ''
                      longitude: ''
                      bindCount: 0
                      status: 0
                      detectDataType: 0
                      groupId: 0
                      remark: ''
                    authorizeResVO:
                      avatar: ''
                      name: ''
                      userId: 0
                      email: ''
                    authList:
                      - avatar: ''
                        name: ''
                        userId: 0
                        email: ''
                    cycle: 0
                code: 0
                msg: ''
      security: []
